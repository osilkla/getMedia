<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Permissions POC</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    .permissions {
      margin-bottom: 20px;
    }
    button {
      margin-right: 10px;
      margin-top: 10px;
    }
    .error {
      color: red;
    }
  </style>
</head>
<body>
  <h1>Media Permissions POC</h1>
  <div class="permissions">
    <p><strong>Camera Permission:</strong> <span id="camera-permission">Loading...</span></p>
    <p><strong>Microphone Permission:</strong> <span id="mic-permission">Loading...</span></p>
    <p><strong>Audio Output Devices:</strong> <span id="audio-devices">Checking...</span></p>
  </div>
  <div>
    <button id="camera-btn">Request Camera</button>
    <button id="mic-btn">Request Microphone</button>
  </div>
  <div id="error-message" class="error"></div>

  <script>
    async function updatePermissions() {
      try {
        const cameraPermission = await navigator.permissions.query({ name: 'camera' });
        const micPermission = await navigator.permissions.query({ name: 'microphone' });

        document.getElementById('camera-permission').textContent = cameraPermission.state;
        document.getElementById('mic-permission').textContent = micPermission.state;

        cameraPermission.onchange = () => {
          document.getElementById('camera-permission').textContent = cameraPermission.state;
        };
        micPermission.onchange = () => {
          document.getElementById('mic-permission').textContent = micPermission.state;
        };
      } catch (err) {
        console.error('Error fetching permissions:', err);
      }
    }

    async function getAudioOutputDevices() {
      const audioDevicesElement = document.getElementById('audio-devices');
      audioDevicesElement.textContent = 'Checking...';

      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const audioOutputDevices = devices.filter(device => device.kind === 'audiooutput');

        if (audioOutputDevices.length > 0) {
          const list = audioOutputDevices.map(device => `${device.label || 'Unnamed Device'} (ID: ${device.deviceId})`);
          audioDevicesElement.textContent = list.join(', ');
        } else {
          audioDevicesElement.textContent = 'No audio output devices found.';
        }
      } catch (err) {
        console.error('Error fetching audio devices:', err);
        audioDevicesElement.textContent = 'Error checking audio output devices.';
      }
    }

    function setAudioOutputDevice(deviceId) {
      const audioTags = document.getElementsByTagName('audio');
      Array.from(audioTags).forEach(tag => {
        if (typeof tag.setSinkId === 'function') {
          tag.setSinkId(deviceId)
            .then(() => console.log(`Audio output set to device ID: ${deviceId}`))
            .catch(err => console.error(`Error setting audio output device: ${err.message}`));
        } else {
          console.warn('setSinkId is not supported in this browser.');
        }
      });
    }

    async function requestMedia(constraints) {
      const errorMessageElement = document.getElementById('error-message');
      errorMessageElement.textContent = '';

      try {
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        console.log('Media access granted:', constraints);

        stream.getTracks().forEach(track => track.stop());

        updatePermissions();
      } catch (err) {
        console.error('Media access denied or error:', err);

        if (err.name === 'NotAllowedError') {
          errorMessageElement.textContent = 'Access denied: You blocked the media access request.';
        } else if (err.name === 'NotFoundError') {
          errorMessageElement.textContent = 'No suitable media device found.';
        } else {
          errorMessageElement.textContent = `Unexpected error: ${err.message}`;
        }

        updatePermissions();
      }
    }

    document.getElementById('camera-btn').addEventListener('click', () => {
      requestMedia({ video: true });
    });

    document.getElementById('mic-btn').addEventListener('click', () => {
      requestMedia({ audio: true });
    });

    updatePermissions();
    getAudioOutputDevices();
  </script>
</body>
</html>
