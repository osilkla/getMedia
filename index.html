<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Permissions POC</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    .permissions {
      margin-bottom: 20px;
    }
    button {
      margin-right: 10px;
      margin-top: 10px;
    }
    .error {
      color: red;
    }
  </style>
</head>
<body>
  <h1>Media Permissions POC</h1>
  <div class="permissions">
    <p><strong>Camera Permission:</strong> <span id="camera-permission">Loading...</span></p>
    <p><strong>Microphone Permission:</strong> <span id="mic-permission">Loading...</span></p>
    <p><strong>Audio Output Permission:</strong> <span id="audio-permission">Unavailable (cannot query directly)</span></p>
  </div>
  <div>
    <button id="camera-btn">Request Camera</button>
    <button id="mic-btn">Request Microphone</button>
    <button id="audio-btn">Request Audio Output</button>
  </div>
  <div id="error-message" class="error"></div>

  <script>
    async function updatePermissions() {
      try {
        // Query permissions for camera and microphone
        const cameraPermission = await navigator.permissions.query({ name: 'camera' });
        const micPermission = await navigator.permissions.query({ name: 'microphone' });

        // Update the displayed permission states
        document.getElementById('camera-permission').textContent = cameraPermission.state;
        document.getElementById('mic-permission').textContent = micPermission.state;

        // Handle permission state changes dynamically
        cameraPermission.onchange = () => {
          document.getElementById('camera-permission').textContent = cameraPermission.state;
        };
        micPermission.onchange = () => {
          document.getElementById('mic-permission').textContent = micPermission.state;
        };
      } catch (err) {
        console.error('Error fetching permissions:', err);
      }
    }

    // Request media access
    async function requestMedia(constraints) {
      const errorMessageElement = document.getElementById('error-message');
      errorMessageElement.textContent = ''; // Clear previous error messages

      try {
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        console.log('Media access granted:', constraints);

        // Stop the stream to release resources
        stream.getTracks().forEach(track => track.stop());

        // Refresh permissions after access
        updatePermissions();
      } catch (err) {
        console.error('Media access denied or error:', err);

        // Handle specific errors
        if (err.name === 'NotAllowedError') {
          errorMessageElement.textContent = 'Access denied: You blocked the media access request.';
        } else if (err.name === 'NotFoundError') {
          errorMessageElement.textContent = 'No suitable media device found.';
        } else {
          errorMessageElement.textContent = `Unexpected error: ${err.message}`;
        }

        // Refresh permissions in case the state has changed
        updatePermissions();
      }
    }

    // Add event listeners to buttons
    document.getElementById('camera-btn').addEventListener('click', () => {
      requestMedia({ video: true });
    });
    document.getElementById('mic-btn').addEventListener('click', () => {
      requestMedia({ audio: true });
    });
    document.getElementById('audio-btn').addEventListener('click', () => {
      // Simulate audio output request (maps to microphone access for this demo)
      requestMedia({ audio: true });
    });

    // Initialize permission states
    updatePermissions();
  </script>
</body>
</html>
